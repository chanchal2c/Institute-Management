{% extends "master/base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  {{page_title}}
{% endblock title %}

{% block content %}

  <div class="w-50 mx-auto mt-3">
    <h1>{{form_title}}</h1>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form | crispy }}
      
      <button type="submit" class="btn btn-primary">{{form_btn}}</button>
    </form>
  </div>
{% endblock content %}
